name: Kyro tvOS focus simulator

on:
  push:
    branches: [kyro/tvos]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Tests to run: full suite, Siri Remote UI, or focused LAN diagnostic export integration tests.'
        type: choice
        default: full
        options:
          - full
          - tvos-ui
          - focus-export

permissions:
  contents: read

jobs:
  tvos-focus:
    runs-on: xcode-27
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - uses: ./.github/actions/install-xcodegen
        with:
          cache: 'true'
          save-cache: 'false'
      - name: Generate tvOS project
        run: xcodegen generate --spec iosApp/project.yml
      - name: Resolve locked packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies -project iosApp/Silo.xcodeproj -scheme SiloTV \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            2>&1 | tee "$RUNNER_TEMP/tvos-packages.log"
      - name: Prepare Apple TV 4K simulator
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          simulator=$(python3 scripts/ci/apple-build-metadata.py --test-simulator SiloTV --runtimes "$RUNNER_TEMP/runtimes.json")
          runtime=$(jq -r .runtime <<< "$simulator")
          device=$(jq -r .device_type <<< "$simulator")
          if [ -z "$runtime" ]; then
            sdk_version=$(xcrun --sdk appletvsimulator --show-sdk-version)
            xcodebuild -downloadPlatform tvOS -buildVersion "$sdk_version"
            xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
            simulator=$(python3 scripts/ci/apple-build-metadata.py --test-simulator SiloTV --runtimes "$RUNNER_TEMP/runtimes.json")
            runtime=$(jq -r .runtime <<< "$simulator")
            device=$(jq -r .device_type <<< "$simulator")
          fi
          test -n "$runtime"
          id=$(xcrun simctl create Kyro-Focus-Apple-TV-4K "$device" "$runtime")
          echo "TVOS_SIMULATOR_ID=$id" >> "$GITHUB_ENV"
          xcrun simctl boot "$id"
          xcrun simctl bootstatus "$id" -b
          echo "Simulator: $device / $runtime / $id"
      - name: Build tvOS app and tests
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -project iosApp/Silo.xcodeproj -scheme SiloTV \
            -destination "platform=tvOS Simulator,id=$TVOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/kyro-derived" \
            -jobs 2 -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$RUNNER_TEMP/tvos-build.log"
      - name: Run focus and large-catalog regressions
        shell: bash
        env:
          # Push runs and the default manual run use the full suite.
          SUITE: ${{ inputs.suite || 'full' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/guide-renders"
          export TEST_RUNNER_KYRO_RENDER_DIR="$RUNNER_TEMP/guide-renders"
          if [ "$SUITE" = "tvos-ui" ]; then
            tests=(SiloTVUITests/KyroTVRemoteFocusUITests)
          elif [ "$SUITE" = "focus-export" ]; then
            tests=(SiloTVTests/TVFocusReportServerTests)
          else
            tests=(
              SiloTVTests/KyroTVFocusTests
              SiloTVTests/KyroTVVisibilityTests
              SiloTVTests/KyroTVLiveTVBrowseFocusTests
              SiloTVTests/KyroTVGuideLayoutTests
              SiloTVTests/KyroTVEdgeToEdgeLayoutTests
              SiloTVUITests/KyroTVRemoteFocusUITests
              SiloTVTests/KyroTVLiveTVTests
              SiloTVTests/LiveTVImportProgressTests
              SiloTVTests/XtreamVODTests
              SiloTVTests/XtreamVODRefreshTests
              SiloTVTests/XtreamVODLargeCatalogTests
              SiloTVTests/TVVideoSourceTests
              SiloTVTests/KyroTVFoundationTests
              SiloTVTests/LibraryVideoScopeTests
              SiloTVTests/KyroTVPairingTransferTests
              SiloTVTests/LiveTVChannelSnapshotTests/testImportProgressCompletesOnlyAfterGuideAndCountsAcceptedChannels
              SiloTVTests/LiveTVChannelSnapshotTests/testNetworkFailureAndRetryPreservePreviousChannels
              SiloTVTests/LiveTVChannelSnapshotTests/testXtreamImportCountsDecodedStreamRecords
              SiloTVTests/LiveTVChannelSnapshotTests/testCancellationStopsHeldDownloadAndAllowsRetry
              SiloTVTests/LiveTVChannelSnapshotTests/testOversizedDownloadFailsWithoutReplacingWorkingProvider
              SiloTVTests/LiveTVChannelSnapshotTests/testTransferCapStopsUnknownLengthResponse
              SiloTVTests/LiveTVCatalogCapacityTests/test40kImportKeepsEveryChannelBelowTheNewCap
              SiloTVTests/LiveTVCatalogCapacityTests/test60kAnd100kCountsAndCap
              SiloTVTests/LiveTVCatalogBenchmarkTests/test100kHostedBenchmark
              SiloTVTests/TVMenuEntryFocusStateTests
              SiloTVTests/LiveTVCatalogCapacityTests/test40kSearchAndEventMatching
            )
          fi
          only=()
          for test in "${tests[@]}"; do only+=("-only-testing:$test"); done
          echo "Suite: $SUITE (${#tests[@]} selections)"
          xcodebuild test-without-building -project iosApp/Silo.xcodeproj -scheme SiloTV \
            -destination "platform=tvOS Simulator,id=$TVOS_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/kyro-derived" \
            -jobs 2 -parallel-testing-enabled NO -collect-test-diagnostics never \
            "${only[@]}" \
            -resultBundlePath "$RUNNER_TEMP/tvos-focus.xcresult" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            2>&1 | tee "$RUNNER_TEMP/tvos-tests.log"
      - name: Capture simulator screen and focused logs
        if: always() && env.TVOS_SIMULATOR_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          # XCTest can shut down its device. Reboot it and launch the built
          # app so screenshot capture has a live TVOut surface.
          xcrun simctl boot "$TVOS_SIMULATOR_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$TVOS_SIMULATOR_ID" -b
          xcrun simctl install "$TVOS_SIMULATOR_ID" \
            "$RUNNER_TEMP/kyro-derived/Build/Products/Debug-appletvsimulator/SiloTV.app"
          xcrun simctl launch "$TVOS_SIMULATOR_ID" com.cubbiestream.kyro.tvos \
            > "$RUNNER_TEMP/tvos-launch.log" 2>&1
          xcrun simctl io "$TVOS_SIMULATOR_ID" screenshot "$RUNNER_TEMP/tvos-screen.png"
          xcrun simctl spawn "$TVOS_SIMULATOR_ID" log show --last 2m \
            --predicate 'process == "SiloTV"' --style compact 2>&1 \
            | tail -n 2000 > "$RUNNER_TEMP/tvos-app.log"
          xcrun simctl list devices > "$RUNNER_TEMP/simulators.txt"
      - name: Export rendered guide screenshots
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/guide-renders"
          if [ -d "$RUNNER_TEMP/tvos-focus.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/tvos-focus.xcresult" \
              --output-path "$RUNNER_TEMP/guide-renders/xcresult" || true
          fi
          find "$RUNNER_TEMP/guide-renders" -type f | sort
      - name: Upload tvOS results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kyro-tvos-focus-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tvos-focus.xcresult
            ${{ runner.temp }}/tvos-screen.png
            ${{ runner.temp }}/tvos-app.log
            ${{ runner.temp }}/tvos-launch.log
            ${{ runner.temp }}/tvos-build.log
            ${{ runner.temp }}/tvos-packages.log
            ${{ runner.temp }}/tvos-tests.log
            ${{ runner.temp }}/simulators.txt
            ${{ runner.temp }}/guide-renders
          retention-days: 7
