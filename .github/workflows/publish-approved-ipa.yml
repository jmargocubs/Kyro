name: Publish approved IPA and update catalog

on:
  workflow_run:
    workflows: ["Cloud unsigned IPA (free runner)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing successful Cloud unsigned IPA run ID to recover"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Serialize all Kyro catalog writers. IPA builds are platform-isolated; catalog
  # updates still share feather-apps main and must not race each other.
  # True cross-repository locking with Flippy/Sunny requires the feather-apps
  # catalog-write workflow proposed alongside this pilot (not applied yet).
  group: publish-approved-ipa-catalog
  cancel-in-progress: false

jobs:
  publish:
    # Only the two trusted Kyro branches can publish. Pull requests, forks, and
    # every other branch are deliberately excluded.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'kyro/m1-rebrand' ||
        github.event.workflow_run.head_branch == 'kyro/tvos' ||
        github.event.workflow_run.head_branch == 'kyro/phase2-stable-integration')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.KYRO }}
      RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
      KYRO_REPO: jmargocubs/Kyro
      CATALOG_REPO: jmargocubs/feather-apps
    steps:
      - name: Require catalog token
        run: test -n "$GH_TOKEN"

      - name: Download the exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build"
          mapfile -t artifacts < <(gh api "repos/$KYRO_REPO/actions/runs/$RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.expired == false and (.name | startswith("Kyro-ios-unsigned-ipa-") or startswith("Kyro-tvos-unsigned-ipa-"))) | .name')
          test "${#artifacts[@]}" -eq 1
          gh run download "$RUN_ID" --repo "$KYRO_REPO" --name "${artifacts[0]}" --dir "$RUNNER_TEMP/build"

      - name: Validate IPA and derive release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/build" -type f -name '*.ipa' -print -quit)
          test -n "$ipa" && test "$(find "$RUNNER_TEMP/build" -type f -name '*.ipa' | wc -l | tr -d ' ')" = 1
          python3 - "$ipa" "$RUNNER_TEMP/build" "$GITHUB_OUTPUT" "$RUNNER_TEMP" <<'PY'
          import hashlib, pathlib, plistlib, sys, zipfile
          ipa, build_dir, output, temp_dir = map(pathlib.Path, sys.argv[1:])
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              forbidden = [n for n in names if n.endswith(("embedded.mobileprovision", ".p8", ".p12", ".cer", ".mobileprovision"))]
              if forbidden:
                  raise SystemExit(f"forbidden signing/credential files: {forbidden}")
              plist_names = [n for n in names if n.startswith("Payload/") and n.endswith(".app/Info.plist")]
              if len(plist_names) != 1:
                  raise SystemExit("IPA must contain exactly one host app Info.plist")
              plist_name = plist_names[0]
              plist = plistlib.loads(archive.read(plist_name))
              app_root = plist_name.rsplit("/Info.plist", 1)[0]
              executable = plist.get("CFBundleExecutable")
              binary = archive.read(f"{app_root}/{executable}")
              (temp_dir / "app-bin").write_bytes(binary)
          bundle = plist["CFBundleIdentifier"]
          version = str(plist["CFBundleShortVersionString"])
          build = str(plist["CFBundleVersion"])
          min_os = plist["MinimumOSVersion"]
          supported = plist.get("CFBundleSupportedPlatforms", [])
          info = build_dir / ("BUILD-INFO-tvos.txt" if "AppleTVOS" in supported else "BUILD-INFO-ios.txt")
          metadata = dict(line.split(": ", 1) for line in info.read_text().splitlines() if ": " in line)
          # Catalog version must match the IPA short version, and that short
          # version must be major.minor.<build> (e.g. 1.0.105 for build 105).
          parts = version.split(".")
          if len(parts) != 3 or parts[2] != build or not all(p.isdigit() for p in parts):
              raise SystemExit(
                  f"CFBundleShortVersionString {version!r} must equal major.minor.{build} "
                  f"and match CFBundleVersion {build!r}"
              )
          if metadata.get("marketing_version") not in (None, version):
              raise SystemExit(
                  f"BUILD-INFO marketing_version {metadata.get('marketing_version')!r} "
                  f"!= IPA CFBundleShortVersionString {version!r}"
              )
          if metadata.get("build_number") not in (None, build):
              raise SystemExit(
                  f"BUILD-INFO build_number {metadata.get('build_number')!r} "
                  f"!= IPA CFBundleVersion {build!r}"
              )
          platform = "tvos" if "AppleTVOS" in supported else "ios"
          phase2_source = metadata.get("source_ref") == "kyro/phase2-stable-integration"
          if platform == "tvos":
              production_source = metadata.get("source_ref") == "kyro/tvos"
              build104_recovery = (
                  metadata.get("source_ref") == "kyro/tvos-build104-recovery"
                  and metadata.get("source_commit") == "f66d9e929cce41c90b67bbeaffaf057f342438d1"
                  and build == "104"
                  and version == "1.0.104"
              )
              if build104_recovery and plist.get("CFBundleDisplayName") != "Kyro Build 104":
                  raise SystemExit("Build 104 recovery display name mismatch")
              if bundle != "com.cubbiestream.kyro.tvos" or not (production_source or build104_recovery or phase2_source):
                  raise SystemExit("tvOS bundle/source identity mismatch")
              if f"{app_root}/PlugIns/SiloTVTopShelf.appex/Info.plist" not in names:
                  raise SystemExit("tvOS IPA is missing the Top Shelf extension")
              catalog, name = "source.json", "Kyro Apple TV"
          else:
              # kyro/ios-recovered is the current iOS line (Build 127 stable tag,
              # Build 136 published); kyro/m1-rebrand stays allowed for history.
              production_source = metadata.get("source_ref") in ("kyro/m1-rebrand", "kyro/ios-recovered")
              if bundle != "com.cubbiestream.kyro" or not (production_source or phase2_source):
                  raise SystemExit("iOS bundle/source identity mismatch")
              if "iPhoneOS" not in supported:
                  raise SystemExit("iOS IPA does not declare iPhoneOS")
              catalog, name = "source.json", "Kyro"
          if "arm64" not in __import__("subprocess").check_output(["file", str(temp_dir / "app-bin")], text=True):
              raise SystemExit("IPA is not arm64")
          sha = hashlib.sha256(ipa.read_bytes()).hexdigest()
          size = ipa.stat().st_size
          (temp_dir / f"{ipa.name}.sha256").write_text(f"{sha}  {ipa.name}\n")
          values = {"ipa": str(ipa), "platform": platform, "catalog": catalog, "name": name,
                    "bundle_id": bundle, "version": version, "build": build, "min_os": min_os, "sha": sha,
                    "ipa_size": str(size), "source_sha": metadata["source_commit"],
                    "source_ref": metadata["source_ref"]}
          with output.open("a") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Create or verify Kyro pre-release
        shell: bash
        env:
          IPA: ${{ steps.metadata.outputs.ipa }}
          SHA: ${{ steps.metadata.outputs.sha }}
          IPA_SIZE: ${{ steps.metadata.outputs.ipa_size }}
          PLATFORM: ${{ steps.metadata.outputs.platform }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD: ${{ steps.metadata.outputs.build }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          tag="kyro-${PLATFORM}-v${VERSION}-build${BUILD}-rc1"
          title="Kyro ${PLATFORM} ${VERSION} Build ${BUILD}"
          # Cloud unsigned IPA names include platform ("…-ios-unsigned-arm64.ipa").
          # Feather / NullSign catalog URLs for iOS expect Kyro-vX-BuildN-Unsigned.ipa.
          if [ "$PLATFORM" = ios ]; then
            published="$RUNNER_TEMP/Kyro-v${VERSION}-Build${BUILD}-Unsigned.ipa"
            cp "$IPA" "$published"
            IPA="$published"
          fi
          checksum="$RUNNER_TEMP/$(basename "$IPA").sha256"
          printf '%s  %s\n' "$SHA" "$(basename "$IPA")" > "$checksum"
          if gh release view "$tag" --repo "$KYRO_REPO" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --repo "$KYRO_REPO" --json isPrerelease --jq .isPrerelease)" = true
          else
            gh release create "$tag" "$IPA" "$checksum" --repo "$KYRO_REPO" --target "$SOURCE_SHA" --prerelease --title "$title" --notes "UNSIGNED PRE-RELEASE — NOT YET DEVICE VERIFIED. Users must sign and sideload this ${PLATFORM} application themselves. SHA-256: $SHA"
          fi

      - name: Update feather-apps catalog
        id: catalog
        shell: bash
        env:
          IPA: ${{ steps.metadata.outputs.ipa }}
          PLATFORM: ${{ steps.metadata.outputs.platform }}
          CATALOG: ${{ steps.metadata.outputs.catalog }}
          APP_NAME: ${{ steps.metadata.outputs.name }}
          BUNDLE_ID: ${{ steps.metadata.outputs.bundle_id }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD: ${{ steps.metadata.outputs.build }}
          MIN_OS: ${{ steps.metadata.outputs.min_os }}
          SHA: ${{ steps.metadata.outputs.sha }}
          IPA_SIZE: ${{ steps.metadata.outputs.ipa_size }}
        run: |
          set -euo pipefail
          # PARTIAL PUBLICATION FAILURE on catalog 403: Kyro prerelease already
          # exists above and must not be deleted. Fail this job clearly and leave
          # recovery to workflow_dispatch once secrets/permissions are fixed.
          clone_err="$RUNNER_TEMP/catalog-clone.err"
          if ! git clone "https://x-access-token:$GH_TOKEN@github.com/$CATALOG_REPO.git" "$RUNNER_TEMP/catalog" 2>"$clone_err"; then
            if grep -Eq '403|Authentication failed|Permission denied' "$clone_err"; then
              {
                echo "### PARTIAL PUBLICATION FAILURE"
                echo "GitHub release creation/verification succeeded, but catalog publication failed (feather-apps clone 403)."
                echo "The Kyro prerelease was preserved."
                echo "Recovery: fix \`secrets.KYRO\` contents:write access to \`$CATALOG_REPO\`, then re-run this workflow with source_run_id=\`$RUN_ID\`."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::error::PARTIAL PUBLICATION FAILURE — release preserved; catalog not updated (clone 403). Retry via workflow_dispatch source_run_id=$RUN_ID"
              echo "deferred=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            cat "$clone_err" >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/catalog/$CATALOG" "$APP_NAME" "$BUNDLE_ID" "$PLATFORM" "$VERSION" "$BUILD" "$MIN_OS" "$SHA" "$IPA_SIZE" <<'PY'
          import json, pathlib, sys
          path, name, bundle_id, platform, version, build, min_os, sha, ipa_size = sys.argv[1:]
          build_i = int(build)
          listing_sep = " — Build "
          listing_name = f"{name}{listing_sep}{build}"
          data = json.loads(pathlib.Path(path).read_text())

          def find_app(apps):
              for candidate in apps:
                  if candidate.get("bundleIdentifier") == bundle_id:
                      return candidate
              for candidate in apps:
                  current = candidate.get("name") or ""
                  if current == name or current.startswith(name + listing_sep):
                      return candidate
              raise SystemExit(f"catalog app not found for bundle {bundle_id} / name {name}")

          app = find_app(data["apps"])
          if app.get("bundleIdentifier") not in (None, bundle_id):
              raise SystemExit(f"bundle mismatch for {name}: {app.get('bundleIdentifier')} != {bundle_id}")
          app["bundleIdentifier"] = bundle_id
          url = f"https://github.com/jmargocubs/Kyro/releases/download/kyro-{platform}-v{version}-build{build}-rc1/" + (f"Kyro-{version}-{build}-tvos-unsigned-arm64.ipa" if platform == "tvos" else f"Kyro-v{version}-Build{build}-Unsigned.ipa")
          expected = {"version": version, "buildVersion": build, "downloadURL": url, "size": int(ipa_size), "minOSVersion": min_os}
          for old in app.get("versions", []):
              if old.get("version") == version and old.get("buildVersion") == build:
                  if old.get("downloadURL") != url or old.get("size") != expected["size"]:
                      raise SystemExit("existing version/build differs; refusing overwrite")
                  # Keep listing title aligned with the head build even on resume.
                  app["name"] = listing_name
                  pathlib.Path(path).write_text(json.dumps(data, indent=2) + "\n")
                  print("catalog entry already present")
                  raise SystemExit(0)
          # Build numbers are compared globally so a new 1.0.104 row cannot land
          # after legacy 1.0.0/105 or aligned 1.0.105/105. Exact version+build
          # resume is handled above; never rewrite older rows.
          existing_builds = []
          for row in app.get("versions", []):
              try:
                  existing_builds.append(int(row.get("buildVersion", 0)))
              except (TypeError, ValueError):
                  continue
          if any(b > build_i for b in existing_builds):
              raise SystemExit("refusing platform catalog downgrade")
          if any(b == build_i for b in existing_builds):
              raise SystemExit("refusing duplicate buildVersion under a different version string")
          app["versions"].insert(0, expected)
          app["size"] = expected["size"]
          app["name"] = listing_name
          pathlib.Path(path).write_text(json.dumps(data, indent=2) + "\n")

          if platform == "tvos":
              tvos_path = pathlib.Path(path).parent / "tvos-source.json"
              if tvos_path.exists():
                  tvos_data = json.loads(tvos_path.read_text())
                  tvos_app = find_app(tvos_data.get("apps", []))
                  already_in_tvos = False
                  for old in tvos_app.get("versions", []):
                      if old.get("version") == version and old.get("buildVersion") == build:
                          already_in_tvos = True
                          break
                  if not already_in_tvos:
                      tvos_builds = []
                      for row in tvos_app.get("versions", []):
                          try:
                              tvos_builds.append(int(row.get("buildVersion", 0)))
                          except (TypeError, ValueError):
                              continue
                      if any(b > build_i for b in tvos_builds):
                          raise SystemExit("refusing tvos-source catalog downgrade")
                      if any(b == build_i for b in tvos_builds):
                          raise SystemExit("refusing duplicate tvos buildVersion under a different version string")
                      tvos_app["versions"].insert(0, expected)
                      tvos_app["size"] = expected["size"]
                  tvos_app["name"] = listing_name
                  tvos_app["bundleIdentifier"] = bundle_id
                  tvos_path.write_text(json.dumps(tvos_data, indent=2) + "\n")
          PY
          cd "$RUNNER_TEMP/catalog"
          git config user.name kyro-release-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$CATALOG"
          if [ "$PLATFORM" = tvos ] && [ -f tvos-source.json ]; then
            git add tvos-source.json
          fi
          if git diff --cached --quiet; then
            echo "No catalog content changes to commit"
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update Kyro $PLATFORM to Build $BUILD"

          # Rebase/retry push softens races with other catalog writers until the
          # feather-apps cross-repo catalog-write lock is adopted.
          attempts=0
          push_err="$RUNNER_TEMP/catalog-push.err"
          until [ "$attempts" -ge 5 ]; do
            attempts=$((attempts + 1))
            if git push origin HEAD:main 2>"$push_err"; then
              echo "deferred=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if grep -Eq '403|Authentication failed|Permission denied' "$push_err"; then
              {
                echo "### PARTIAL PUBLICATION FAILURE"
                echo "GitHub release creation/verification succeeded, but catalog publication failed (feather-apps push 403)."
                echo "The Kyro prerelease was preserved."
                echo "Recovery: fix \`secrets.KYRO\` access to \`$CATALOG_REPO\`, then re-run this workflow with source_run_id=\`$RUN_ID\`."
              } | tee -a "$GITHUB_STEP_SUMMARY"
              echo "::error::PARTIAL PUBLICATION FAILURE — release preserved; catalog not updated (push 403). Retry via workflow_dispatch source_run_id=$RUN_ID"
              echo "deferred=true" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            echo "Push attempt $attempts failed; rebasing onto origin/main"
            cat "$push_err" >&2 || true
            git fetch origin main
            git rebase origin/main
            # Re-apply catalog mutation after rebase if needed is complex; refuse
            # silently losing guards by stopping when rebase conflicts.
            if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
              echo "::error::catalog rebase conflict; refusing automatic overwrite"
              git rebase --abort || true
              exit 1
            fi
            # After rebase, ensure our commit is still present / recreate if fast-forward emptied it.
            if ! git diff --quiet origin/main..HEAD; then
              continue
            fi
            # Remote already has our commit equivalent or we need to rebuild — stop safely.
            echo "::error::catalog push race could not be resolved safely; retry via workflow_dispatch"
            exit 1
          done
          echo "::error::catalog push failed after retries"
          cat "$push_err" >&2 || true
          exit 1
