name: Publish approved IPA and update catalog

on:
  workflow_run:
    workflows: ["Cloud unsigned IPA (free runner)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing successful Cloud unsigned IPA run ID to publish/recover"
        required: true
        type: string
      publish_approved:
        description: "That build is approved for distribution (required)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Serialize all Kyro catalog writers. IPA builds are platform-isolated; catalog
  # updates still share feather-apps main and must not race each other.
  # True cross-repository locking with Flippy/Sunny requires the feather-apps
  # catalog-write workflow proposed alongside this pilot (not applied yet).
  group: publish-approved-ipa-catalog
  cancel-in-progress: false

jobs:
  publish:
    # Cloud builds run on the default branch and pick their source with `ref`, so
    # the real gate is the source_ref allowlist in "Inspect IPA" below. Pull
    # requests, forks, and every other branch are deliberately excluded.
    # Approval gate: a cloud build publishes only if it was started with
    # publish_approved (recorded in its run name and BUILD-INFO); a manual
    # recovery run needs its own publish_approved input.
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_approved) ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(github.event.workflow_run.display_title, '[publish-approved]') &&
       (github.event.workflow_run.head_branch == 'kyro/m1-rebrand' ||
        github.event.workflow_run.head_branch == 'kyro/ios-recovered' ||
        github.event.workflow_run.head_branch == 'kyro/tvos-recovered' ||
        github.event.workflow_run.head_branch == 'kyro/tvos' ||
        github.event.workflow_run.head_branch == 'kyro/phase2-stable-integration')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.KYRO }}
      RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
      KYRO_REPO: jmargocubs/Kyro
      CATALOG_REPO: jmargocubs/feather-apps
    steps:
      - name: Require catalog token
        run: test -n "$GH_TOKEN"

      - name: Download the exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build"
          mapfile -t artifacts < <(gh api "repos/$KYRO_REPO/actions/runs/$RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.expired == false and (.name | startswith("Kyro-ios-unsigned-ipa-") or startswith("Kyro-tvos-unsigned-ipa-"))) | .name')
          test "${#artifacts[@]}" -eq 1
          gh run download "$RUN_ID" --repo "$KYRO_REPO" --name "${artifacts[0]}" --dir "$RUNNER_TEMP/build"

      - name: Validate IPA and derive release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/build" -type f -name '*.ipa' -print -quit)
          test -n "$ipa" && test "$(find "$RUNNER_TEMP/build" -type f -name '*.ipa' | wc -l | tr -d ' ')" = 1
          python3 - "$ipa" "$RUNNER_TEMP/build" "$GITHUB_OUTPUT" "$RUNNER_TEMP" <<'PY'
          import hashlib, pathlib, plistlib, sys, zipfile
          ipa, build_dir, output, temp_dir = map(pathlib.Path, sys.argv[1:])
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              forbidden = [n for n in names if n.endswith(("embedded.mobileprovision", ".p8", ".p12", ".cer", ".mobileprovision"))]
              if forbidden:
                  raise SystemExit(f"forbidden signing/credential files: {forbidden}")
              plist_names = [n for n in names if n.startswith("Payload/") and n.endswith(".app/Info.plist")]
              if len(plist_names) != 1:
                  raise SystemExit("IPA must contain exactly one host app Info.plist")
              plist_name = plist_names[0]
              plist = plistlib.loads(archive.read(plist_name))
              app_root = plist_name.rsplit("/Info.plist", 1)[0]
              executable = plist.get("CFBundleExecutable")
              binary = archive.read(f"{app_root}/{executable}")
              (temp_dir / "app-bin").write_bytes(binary)
          bundle = plist["CFBundleIdentifier"]
          version = str(plist["CFBundleShortVersionString"])
          build = str(plist["CFBundleVersion"])
          min_os = plist["MinimumOSVersion"]
          supported = plist.get("CFBundleSupportedPlatforms", [])
          info = build_dir / ("BUILD-INFO-tvos.txt" if "AppleTVOS" in supported else "BUILD-INFO-ios.txt")
          metadata = dict(line.split(": ", 1) for line in info.read_text().splitlines() if ": " in line)
          # Catalog version must match the IPA short version, and that short
          # version must be major.minor.<build> (e.g. 1.0.105 for build 105).
          parts = version.split(".")
          if len(parts) != 3 or parts[2] != build or not all(p.isdigit() for p in parts):
              raise SystemExit(
                  f"CFBundleShortVersionString {version!r} must equal major.minor.{build} "
                  f"and match CFBundleVersion {build!r}"
              )
          if metadata.get("marketing_version") not in (None, version):
              raise SystemExit(
                  f"BUILD-INFO marketing_version {metadata.get('marketing_version')!r} "
                  f"!= IPA CFBundleShortVersionString {version!r}"
              )
          if metadata.get("build_number") not in (None, build):
              raise SystemExit(
                  f"BUILD-INFO build_number {metadata.get('build_number')!r} "
                  f"!= IPA CFBundleVersion {build!r}"
              )
          platform = "tvos" if "AppleTVOS" in supported else "ios"
          phase2_source = metadata.get("source_ref") == "kyro/phase2-stable-integration"
          if platform == "tvos":
              # kyro/tvos-recovered is the current Kyro X tvOS line (built on the
              # device-accepted Build 104; audit 2026-11-27). kyro/tvos stays for history.
              production_source = metadata.get("source_ref") in ("kyro/tvos", "kyro/tvos-recovered")
              build104_recovery = (
                  metadata.get("source_ref") == "kyro/tvos-build104-recovery"
                  and metadata.get("source_commit") == "f66d9e929cce41c90b67bbeaffaf057f342438d1"
                  and build == "104"
                  and version == "1.0.104"
              )
              if build104_recovery and plist.get("CFBundleDisplayName") != "Kyro Build 104":
                  raise SystemExit("Build 104 recovery display name mismatch")
              if bundle != "com.cubbiestream.kyro.tvos" or not (production_source or build104_recovery or phase2_source):
                  raise SystemExit("tvOS bundle/source identity mismatch")
              if f"{app_root}/PlugIns/SiloTVTopShelf.appex/Info.plist" not in names:
                  raise SystemExit("tvOS IPA is missing the Top Shelf extension")
              catalog, name = "source.json", "Kyro X tvOS"
          else:
              # kyro/ios-recovered is the current iOS line (Build 127 stable tag,
              # Build 136 published); kyro/m1-rebrand stays allowed for history.
              production_source = metadata.get("source_ref") in ("kyro/m1-rebrand", "kyro/ios-recovered")
              if bundle != "com.cubbiestream.kyro" or not (production_source or phase2_source):
                  raise SystemExit("iOS bundle/source identity mismatch")
              if "iPhoneOS" not in supported:
                  raise SystemExit("iOS IPA does not declare iPhoneOS")
              catalog, name = "source.json", "Kyro X iOS"
          if "arm64" not in __import__("subprocess").check_output(["file", str(temp_dir / "app-bin")], text=True):
              raise SystemExit("IPA is not arm64")
          sha = hashlib.sha256(ipa.read_bytes()).hexdigest()
          size = ipa.stat().st_size
          (temp_dir / f"{ipa.name}.sha256").write_text(f"{sha}  {ipa.name}\n")
          values = {"ipa": str(ipa), "platform": platform, "catalog": catalog, "name": name,
                    "bundle_id": bundle, "version": version, "build": build, "min_os": min_os, "sha": sha,
                    "ipa_size": str(size), "source_sha": metadata["source_commit"],
                    "source_ref": metadata["source_ref"]}
          with output.open("a") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Confirm the build was approved for distribution
        shell: bash
        env:
          PLATFORM: ${{ steps.metadata.outputs.platform }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            grep -qx 'publish_approved: true' "$RUNNER_TEMP/build/BUILD-INFO-$PLATFORM.txt" || {
              echo "::error::build was not started with publish_approved; nothing published"; exit 1; }
          fi

      # Same publisher as local Mac publishing (feather-apps scripts/publish_ipa.py):
      # identical tag, release title/notes, asset name, download URL and catalog entry.
      - name: Publish release and update the Kyro X catalog entry
        shell: bash
        env:
          IPA: ${{ steps.metadata.outputs.ipa }}
          PLATFORM: ${{ steps.metadata.outputs.platform }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD: ${{ steps.metadata.outputs.build }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          app=kyro; [ "$PLATFORM" = tvos ] && app=kyro-tvos
          clone_err="$RUNNER_TEMP/catalog-clone.err"
          if ! git clone --depth 50 "https://x-access-token:$GH_TOKEN@github.com/$CATALOG_REPO.git" "$RUNNER_TEMP/catalog" 2>"$clone_err"; then
            sed -E 's#x-access-token:[^@]*@#x-access-token:***@#g' "$clone_err" >&2
            echo "::error::cannot clone $CATALOG_REPO with secrets.KYRO; nothing published. Fix the secret, then re-run with source_run_id=$RUN_ID"
            exit 1
          fi
          cd "$RUNNER_TEMP/catalog"
          git config user.name kyro-release-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 scripts/publish_ipa.py "$IPA" --app "$app" --version "$VERSION" --build "$BUILD" \
            --source-commit "$SOURCE_SHA" --approved
