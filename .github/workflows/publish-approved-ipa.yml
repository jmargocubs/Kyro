name: Publish approved IPA and update catalog

on:
  workflow_run:
    workflows: ["Cloud unsigned IPA (free runner)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Existing successful Cloud unsigned IPA run ID to recover"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-approved-ipa
  cancel-in-progress: false

jobs:
  publish:
    # Only the two trusted Kyro branches can publish. Pull requests, forks, and
    # every other branch are deliberately excluded.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'kyro/m1-rebrand' ||
        github.event.workflow_run.head_branch == 'kyro/tvos')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.KYRO }}
      RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}
      KYRO_REPO: jmargocubs/Kyro
      CATALOG_REPO: jmargocubs/feather-apps
    steps:
      - name: Require catalog token
        run: test -n "$GH_TOKEN"

      - name: Download the exact build artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build"
          mapfile -t artifacts < <(gh api "repos/$KYRO_REPO/actions/runs/$RUN_ID/artifacts" --paginate --jq '.artifacts[] | select(.expired == false and (.name | startswith("Kyro-ios-unsigned-ipa-") or startswith("Kyro-tvos-unsigned-ipa-"))) | .name')
          test "${#artifacts[@]}" -eq 1
          gh run download "$RUN_ID" --repo "$KYRO_REPO" --name "${artifacts[0]}" --dir "$RUNNER_TEMP/build"

      - name: Validate IPA and derive release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          ipa=$(find "$RUNNER_TEMP/build" -type f -name '*.ipa' -print -quit)
          test -n "$ipa" && test "$(find "$RUNNER_TEMP/build" -type f -name '*.ipa' | wc -l | tr -d ' ')" = 1
          python3 - "$ipa" "$RUNNER_TEMP/build" "$GITHUB_OUTPUT" "$RUNNER_TEMP" <<'PY'
          import hashlib, pathlib, plistlib, sys, zipfile
          ipa, build_dir, output, temp_dir = map(pathlib.Path, sys.argv[1:])
          with zipfile.ZipFile(ipa) as archive:
              names = archive.namelist()
              forbidden = [n for n in names if n.endswith(("embedded.mobileprovision", ".p8", ".p12", ".cer", ".mobileprovision"))]
              if forbidden:
                  raise SystemExit(f"forbidden signing/credential files: {forbidden}")
              plist_names = [n for n in names if n.startswith("Payload/") and n.endswith(".app/Info.plist")]
              if len(plist_names) != 1:
                  raise SystemExit("IPA must contain exactly one host app Info.plist")
              plist_name = plist_names[0]
              plist = plistlib.loads(archive.read(plist_name))
              app_root = plist_name.rsplit("/Info.plist", 1)[0]
              executable = plist.get("CFBundleExecutable")
              binary = archive.read(f"{app_root}/{executable}")
              (temp_dir / "app-bin").write_bytes(binary)
          bundle = plist["CFBundleIdentifier"]
          version = plist["CFBundleShortVersionString"]
          build = str(plist["CFBundleVersion"])
          min_os = plist["MinimumOSVersion"]
          supported = plist.get("CFBundleSupportedPlatforms", [])
          info = build_dir / ("BUILD-INFO-tvos.txt" if "AppleTVOS" in supported else "BUILD-INFO-ios.txt")
          metadata = dict(line.split(": ", 1) for line in info.read_text().splitlines() if ": " in line)
          platform = "tvos" if "AppleTVOS" in supported else "ios"
          if platform == "tvos":
              if bundle != "com.cubbiestream.kyro.tvos" or metadata.get("source_ref") != "kyro/tvos":
                  raise SystemExit("tvOS bundle/source identity mismatch")
              if f"{app_root}/PlugIns/SiloTVTopShelf.appex/Info.plist" not in names:
                  raise SystemExit("tvOS IPA is missing the Top Shelf extension")
              catalog, name = "source.json", "Kyro Apple TV"
          else:
              if bundle != "com.cubbiestream.kyro" or metadata.get("source_ref") != "kyro/m1-rebrand":
                  raise SystemExit("iOS bundle/source identity mismatch")
              if "iPhoneOS" not in supported:
                  raise SystemExit("iOS IPA does not declare iPhoneOS")
              catalog, name = "source.json", "Kyro"
          if "arm64" not in __import__("subprocess").check_output(["file", str(temp_dir / "app-bin")], text=True):
              raise SystemExit("IPA is not arm64")
          sha = hashlib.sha256(ipa.read_bytes()).hexdigest()
          size = ipa.stat().st_size
          (temp_dir / f"{ipa.name}.sha256").write_text(f"{sha}  {ipa.name}\n")
          values = {"ipa": str(ipa), "platform": platform, "catalog": catalog, "name": name,
                    "version": version, "build": build, "min_os": min_os, "sha": sha,
                    "ipa_size": str(size), "source_sha": metadata["source_commit"],
                    "source_ref": metadata["source_ref"]}
          with output.open("a") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY

      - name: Create or verify Kyro pre-release
        shell: bash
        env:
          IPA: ${{ steps.metadata.outputs.ipa }}
          SHA: ${{ steps.metadata.outputs.sha }}
          IPA_SIZE: ${{ steps.metadata.outputs.ipa_size }}
          PLATFORM: ${{ steps.metadata.outputs.platform }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD: ${{ steps.metadata.outputs.build }}
          SOURCE_SHA: ${{ steps.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          tag="kyro-${PLATFORM}-v${VERSION}-build${BUILD}-rc1"
          title="Kyro ${PLATFORM} ${VERSION} Build ${BUILD}"
          # Cloud unsigned IPA names include platform ("…-ios-unsigned-arm64.ipa").
          # Feather / NullSign catalog URLs for iOS expect Kyro-vX-BuildN-Unsigned.ipa.
          if [ "$PLATFORM" = ios ]; then
            published="$RUNNER_TEMP/Kyro-v${VERSION}-Build${BUILD}-Unsigned.ipa"
            cp "$IPA" "$published"
            IPA="$published"
          fi
          checksum="$RUNNER_TEMP/$(basename "$IPA").sha256"
          printf '%s  %s\n' "$SHA" "$(basename "$IPA")" > "$checksum"
          if gh release view "$tag" --repo "$KYRO_REPO" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --repo "$KYRO_REPO" --json isPrerelease --jq .isPrerelease)" = true
          else
            gh release create "$tag" "$IPA" "$checksum" --repo "$KYRO_REPO" --target "$SOURCE_SHA" --prerelease --title "$title" --notes "UNSIGNED PRE-RELEASE — NOT YET DEVICE VERIFIED. Users must sign and sideload this ${PLATFORM} application themselves. SHA-256: $SHA"
          fi

      - name: Update feather-apps catalog
        shell: bash
        env:
          IPA: ${{ steps.metadata.outputs.ipa }}
          PLATFORM: ${{ steps.metadata.outputs.platform }}
          CATALOG: ${{ steps.metadata.outputs.catalog }}
          APP_NAME: ${{ steps.metadata.outputs.name }}
          VERSION: ${{ steps.metadata.outputs.version }}
          BUILD: ${{ steps.metadata.outputs.build }}
          MIN_OS: ${{ steps.metadata.outputs.min_os }}
          SHA: ${{ steps.metadata.outputs.sha }}
          IPA_SIZE: ${{ steps.metadata.outputs.ipa_size }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:$GH_TOKEN@github.com/$CATALOG_REPO.git" "$RUNNER_TEMP/catalog"
          python3 - "$RUNNER_TEMP/catalog/$CATALOG" "$APP_NAME" "$PLATFORM" "$VERSION" "$BUILD" "$MIN_OS" "$SHA" "$IPA_SIZE" <<'PY'
          import json, pathlib, sys
          path, name, platform, version, build, min_os, sha, ipa_size = sys.argv[1:]
          build_i = int(build)
          data = json.loads(pathlib.Path(path).read_text())
          app = next(a for a in data["apps"] if a["name"] == name)
          url = f"https://github.com/jmargocubs/Kyro/releases/download/kyro-{platform}-v{version}-build{build}-rc1/" + (f"Kyro-{version}-{build}-tvos-unsigned-arm64.ipa" if platform == "tvos" else f"Kyro-v{version}-Build{build}-Unsigned.ipa")
          expected = {"version": version, "buildVersion": build, "downloadURL": url, "size": int(ipa_size), "minOSVersion": min_os}
          for old in app.get("versions", []):
              if old.get("version") == version and old.get("buildVersion") == build:
                  if old.get("downloadURL") != url or old.get("size") != expected["size"]:
                      raise SystemExit("existing version/build differs; refusing overwrite")
                  print("catalog entry already present")
                  raise SystemExit(0)
          if any(int(v.get("buildVersion", 0)) >= build_i for v in app.get("versions", []) if v.get("version") == version):
              raise SystemExit("refusing platform catalog downgrade")
          app["versions"].insert(0, expected)
          app["size"] = expected["size"]
          pathlib.Path(path).write_text(json.dumps(data, indent=2) + "\n")

          if platform == "tvos":
              tvos_path = pathlib.Path(path).parent / "tvos-source.json"
              if tvos_path.exists():
                  tvos_data = json.loads(tvos_path.read_text())
                  tvos_app = next((a for a in tvos_data.get("apps", []) if a["name"] == name), None)
                  if tvos_app:
                      already_in_tvos = False
                      for old in tvos_app.get("versions", []):
                          if old.get("version") == version and old.get("buildVersion") == build:
                              already_in_tvos = True
                              break
                      if not already_in_tvos:
                          tvos_app["versions"].insert(0, expected)
                          tvos_app["size"] = expected["size"]
                          tvos_path.write_text(json.dumps(tvos_data, indent=2) + "\n")
          PY
          cd "$RUNNER_TEMP/catalog"
          git config user.name kyro-release-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$CATALOG"
          if [ "$PLATFORM" = tvos ] && [ -f tvos-source.json ]; then
            git add tvos-source.json
          fi
          git diff --cached --quiet || git commit -m "Update Kyro $PLATFORM to Build $BUILD"
          git push origin HEAD:main
